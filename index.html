<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meowsic Player</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body>
  <!-- Header with Menu & Search -->
  <header class="header">
    <div class="header-content">
      <button class="menu-btn" id="menuBtn"><i class="bi bi-list"></i></button>
      <h1 class="logo"><i class="bi bi-music-note-beamed"></i> Meowsic</h1>
      <div class="search-container">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search albums & songs...">
        <span class="search-icon"><i class="bi bi-search"></i></span>
      </div>
    </div>
  </header>

  <!-- Sidebar Menu -->
  <aside class="sidebar" id="sidebar">
    <nav class="menu">
      <button class="menu-close" id="closeMenuBtn"><i class="bi bi-x-lg"></i></button>
      <h3>Menu</h3>
      <a href="#" class="menu-item active"><i class="bi bi-house-fill"></i> Home</a>
      <a href="#" class="menu-item"><i class="bi bi-heart-fill"></i> Favorites</a>
      <a href="#" class="menu-item"><i class="bi bi-music-note-list"></i> Playlists</a>
      <a href="#" class="menu-item"><i class="bi bi-gear-fill"></i> Settings</a>
    </nav>
  </aside>

  <!-- Overlay for sidebar -->
  <div class="overlay" id="overlay"></div>

  <div class="container">
    <div class="main-grid">
      <div class="albums-panel">
        <div class="albums-header">
          <h2>Albums</h2>
        </div>
        <div class="albums" id="albumsContainer"></div>
      </div>

      <div class="player-panel">
        <div class="album-info" id="albumInfo">
          <div class="album-info-card">
            <img id="selectedAlbumCover" src="images/placeholder.png" alt="Selected album cover">
            <div class="album-info-text">
              <h2 id="selectedAlbumName">Pick a song</h2>
              <p id="selectedAlbumArtist">Selected album information will appear here.</p>
              <p id="selectedAlbumTracks">Choose a track to play and the player will appear.</p>
            </div>
          </div>
        </div>
      <div class="player" id="playerContainer" style="display: none;">

        <!-- Album Art (animation/CSS unchanged) -->
        <div class="track-art" id="trackArt"></div>

        <!-- Seek bar row: time — slider — duration -->
        <div class="seek-row">
          <span id="currentTime">00:00</span>
          <input type="range" class="seek-slider" id="seekSlider" value="0" min="0" max="100" />
          <span id="totalDuration">00:00</span>
        </div>

        <!-- Track info row: title+artist (left) | repeat + fav (right) -->
        <div class="track-info-row">
          <div class="now-playing" id="nowPlaying">Select a Track</div>
          <div class="track-actions">
            <button id="repeatBtn" class="icon-btn"><i class="bi bi-repeat"></i></button>
            <button id="favBtn" class="icon-btn"><i class="bi bi-heart"></i></button>
          </div>
        </div>

        <!-- Main controls: shuffle | prev | PLAY | next | volume -->
        <div class="controls-row">
          <button id="shuffleBtn" class="icon-btn"><i class="bi bi-shuffle"></i></button>
          <button id="prevBtn" class="icon-btn"><i class="bi bi-skip-start-fill"></i></button>
          <button id="playPauseBtn" class="play-btn-large"><i class="bi bi-play-fill"></i></button>
          <button id="nextBtn" class="icon-btn"><i class="bi bi-skip-end-fill"></i></button>
          <div class="volume-widget" id="volumeWidget">
            <button class="volume-btn icon-btn" id="volumeBtn" title="Volume"><i class="bi bi-volume-up-fill" id="volumeIcon"></i></button>
            <div class="volume-popup" id="volumePopup">
              <input type="range" class="volume-slider" id="volumeSlider" value="80" min="0" max="100" orient="vertical" />
              <span class="volume-label" id="volumeLabel">80%</span>
            </div>
          </div>
        </div>

      </div>
    </div>

  <script>
    const albums = [
      {
        id: 1, name: "The 1975", artist: "The 1975", cover: "images/album1.jpg",
        tracks: [
          { name: "About You", path: "music/About You - The 1975.mp3" },
          { name: "Be My Mistake", path: "music/The 1975 - Be My Mistake (Acoustic).mp3" },
          { name: "Somebody Else", path: "music/Somebody Else - The 1975.mp3" },
          { name: "Robbers", path: "music/Robbers - The 1975.mp3" },
          { name: "Falling For You", path: "music/The 1975 - fallingforyou.mp3" }
        ]
      },
      {
        id: 2, name: "Thank U, Next", artist: "Ariana Grande", cover: "images/album2.jpg",
        tracks: [
          { name: "Needy", path: "music/album9_needy.mp3.mp3" },
          { name: "7 Rings", path: "music/audioalbum9_7_rings.mp3.mp3" },
          { name: "Bloodline", path: "music/audioalbum9_bloodline.mp3.mp3" },
          { name: "Make Up", path: "music/audioalbum_make_up.mp3.mp3" },
          { name: "Thank U, Next", path: "music/audioalbum9_thank_u_next.mp3.mp3" }
        ]
      },
      {
        id: 3, name: "Midnights", artist: "Taylor Swift", cover: "images/album3.jpg",
        tracks: [
          { name: "Fortnight", path: "music/Taylor Swift - Fortnight (feat. Post Malone).mp3" },
          { name: "Imgonnagetyouback", path: "music/Taylor Swift - imgonnagetyouback (Official Lyric Video).mp3" },
          { name: "I Can Do It With A Broken Heart", path: "music/I Can Do It With a Broken Heart.mp3" },
          { name: "thanK you aIMee", path: "music/Taylor Swift - thanK you aIMee (Official Lyric Video).mp3" },
          { name: "Guilty as Sin?", path: "music/Guilty as Sin.mp3" }
        ]
      },
      {
        id: 4, name: "BINI", artist: "BINI", cover: "images/album4.jpg",
        tracks: [
          { name: "Blush", path: "music/Blush - BINI (youtube).mp3" },
          { name: "Honey Honey", path: "music/Honey Honey - BINI (youtube).mp3" },
          { name: "Step Back", path: "music/Step Back - BINI (youtube).mp3" },
          { name: "Sugar Rush", path: "music/Sugar Rush - BINI (youtube).mp3" },
          { name: "Tic Tac Toe", path: "music/Tic Tac Toe - BINI (youtube).mp3" }
        ]
      },
      {
        id: 5, name: "BLACKPINK", artist: "BLACKPINK", cover: "images/album5.jpg",
        tracks: [
          { name: "GO", path: "music/GO - BLACKPINK (youtube).mp3" },
          { name: "Champion", path: "music/Champion - BLACKPINK (youtube).mp3" },
          { name: "Fxxxboy", path: "music/Fxxxboy - BLACKPINK (youtube).mp3" },
          { name: "Me and My", path: "music/Me and my - BLACKPINK (youtube).mp3" },
          { name: "JUMP", path: "music/BLACKPINK - JUMP (Official Audio).mp3" }
        ]
      }
    ];

    const audio = new Audio();
    let currentAlbum = null;
    let currentTrackIdx = 0;
    let isPlaying = false;
    let isShuffle = false;
    let repeatMode = 'off'; // off, all, one
    let favorites = JSON.parse(localStorage.getItem('meowsic_favorites') || '[]');
    // favorites stored as array of "albumId_trackIdx" strings

    function saveFavorites() {
      localStorage.setItem('meowsic_favorites', JSON.stringify(favorites));
    }

    function getFavKey(albumId, trackIdx) {
      return `${albumId}_${trackIdx}`;
    }

    function isFavorited(albumId, trackIdx) {
      return favorites.includes(getFavKey(albumId, trackIdx));
    }

    function syncFavBtn() {
      if (!currentAlbum) return;
      const favBtn = document.getElementById('favBtn');
      if (isFavorited(currentAlbum.id, currentTrackIdx)) {
        favBtn.innerHTML = '<i class="bi bi-heart-fill"></i>';
        favBtn.classList.add('active');
        favBtn.title = 'Unlike';
      } else {
        favBtn.innerHTML = '<i class="bi bi-heart"></i>';
        favBtn.classList.remove('active');
        favBtn.title = 'Like';
      }
    }

    // Display Albums
    const container = document.getElementById('albumsContainer');
    const selectedAlbumCover = document.getElementById('selectedAlbumCover');
    const selectedAlbumName = document.getElementById('selectedAlbumName');
    const selectedAlbumArtist = document.getElementById('selectedAlbumArtist');
    const selectedAlbumTracks = document.getElementById('selectedAlbumTracks');

    function updateAlbumInfo(album) {
      selectedAlbumCover.src = album.cover;
      selectedAlbumCover.alt = `${album.name} cover`;
      selectedAlbumName.innerText = album.name;
      selectedAlbumArtist.innerText = album.artist;
      selectedAlbumTracks.innerText = `Tracks: ${album.tracks.map(t => t.name).join(', ')}`;
    }

    function displayAlbums() {
      const container = document.getElementById('albumsContainer');
      container.innerHTML = '';
      albums.forEach(album => {
        const div = document.createElement('div');
        div.className = 'album';
        div.innerHTML = `
          <img src="${album.cover}" alt="${album.name}" onerror="this.src='https://placehold.co/180/333/ffa500?text=Check+Images+Folder'">
          <div class="album-desc">
            <h3>${album.name}</h3>
            <p>${album.artist}</p>
          </div>
          <ul class="track-list" style="display:none; background:#222; padding:10px; margin-top:5px; border-radius:5px;">
            ${album.tracks.map((t, i) => `<li class="track-item" data-idx="${i}" style="padding:5px 0; color:#aaa; cursor:pointer;">${i+1}. ${t.name}</li>`).join('')}
          </ul>
        `;

        div.addEventListener('click', () => {
          const list = div.querySelector('.track-list');
          const isOpening = list.style.display === 'none';

          container.querySelectorAll('.track-list').forEach(otherList => {
            otherList.style.display = 'none';
          });

          list.style.display = isOpening ? 'block' : 'none';
        });

        div.querySelectorAll('.track-item').forEach(item => {
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            currentAlbum = album;
            currentTrackIdx = parseInt(item.dataset.idx);
            updateAlbumInfo(album);
            document.getElementById('playerContainer').style.display = 'block';
            playTrack();
          });
        });
        container.appendChild(div);
      });
    }

    // Display Albums initially
    displayAlbums();

    function playTrack() {
      const track = currentAlbum.tracks[currentTrackIdx];
      document.getElementById('nowPlaying').innerText = track.name + " - " + currentAlbum.artist;
      document.getElementById('trackArt').style.backgroundImage = `url(${currentAlbum.cover})`;
      audio.src = track.path;
      audio.play().then(() => {
        isPlaying = true;
        document.getElementById('playPauseBtn').innerHTML = '<i class="bi bi-pause-fill"></i>';
      }).catch(err => alert("Missing File: Ensure the song file exists and path matches: " + track.path));
      
      // Auto-focus to player
      const playerContainer = document.getElementById('playerContainer');
      playerContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
      // Sync fav button state for this track
      syncFavBtn();
    }

    const playPauseBtn = document.getElementById('playPauseBtn');
    playPauseBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        playPauseBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
      } else {
        audio.play();
        isPlaying = true;
        playPauseBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (isShuffle) {
        currentTrackIdx = Math.floor(Math.random() * currentAlbum.tracks.length);
      } else {
        currentTrackIdx = (currentTrackIdx + 1) % currentAlbum.tracks.length;
      }
      playTrack();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentTrackIdx = (currentTrackIdx - 1 + currentAlbum.tracks.length) % currentAlbum.tracks.length;
      playTrack();
    });

    // Shuffle Button
    const shuffleBtn = document.getElementById('shuffleBtn');
    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active');
      console.log(isShuffle ? 'Shuffle ON' : 'Shuffle OFF');
    });

    // Repeat Button
    const repeatBtn = document.getElementById('repeatBtn');
    repeatBtn.addEventListener('click', () => {
      if (repeatMode === 'off') {
        repeatMode = 'all';
        repeatBtn.classList.add('active');
        repeatBtn.innerHTML = '<i class="bi bi-repeat"></i>';
        repeatBtn.title = 'Repeat All';
      } else if (repeatMode === 'all') {
        repeatMode = 'one';
        repeatBtn.innerHTML = '<i class="bi bi-repeat-1"></i>';
        repeatBtn.title = 'Repeat One';
      } else {
        repeatMode = 'off';
        repeatBtn.classList.remove('active');
        repeatBtn.innerHTML = '<i class="bi bi-repeat"></i>';
        repeatBtn.title = 'Repeat';
      }
      console.log('Repeat Mode:', repeatMode);
    });

    // Favorite / Like Button — toggle with cookie persistence
    const favBtn = document.getElementById('favBtn');
    favBtn.addEventListener('click', () => {
      if (!currentAlbum) { return; }
      const key = getFavKey(currentAlbum.id, currentTrackIdx);
      const alreadyLiked = favorites.includes(key);
      if (alreadyLiked) {
        // Unlike
        favorites = favorites.filter(f => f !== key);
        favBtn.innerHTML = '<i class="bi bi-heart"></i>';
        favBtn.classList.remove('active');
        favBtn.title = 'Like';
      } else {
        // Like
        favorites.push(key);
        favBtn.innerHTML = '<i class="bi bi-heart-fill"></i>';
        favBtn.classList.add('active');
        favBtn.title = 'Unlike';
        // Heart pop animation
        favBtn.style.transform = 'scale(1.4)';
        setTimeout(() => favBtn.style.transform = '', 200);
      }
      saveFavorites();
    });

    // Auto-play next track
    audio.addEventListener('ended', () => {
      if (repeatMode === 'one') {
        playTrack();
      } else if (repeatMode === 'all' || !repeatMode.includes('off')) {
        document.getElementById('nextBtn').click();
      } else {
        isPlaying = false;
        document.getElementById('playPauseBtn').innerHTML = '<i class="bi bi-play-fill"></i>';
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      const totalDuration = document.getElementById('totalDuration');
      totalDuration.innerText = Math.floor(audio.duration / 60) + ":" + Math.floor(audio.duration % 60).toString().padStart(2, '0');
    });

    audio.addEventListener('timeupdate', () => {
      const seek = document.getElementById('seekSlider');
      if(audio.duration) seek.value = (audio.currentTime / audio.duration) * 100;
      document.getElementById('currentTime').innerText = Math.floor(audio.currentTime / 60) + ":" + Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
    });

    document.getElementById('seekSlider').addEventListener('input', (e) => {
      audio.currentTime = (e.target.value / 100) * audio.duration;
    });

    // Volume Widget
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeBtn   = document.getElementById('volumeBtn');
    const volumePopup = document.getElementById('volumePopup');
    const volumeIcon  = document.getElementById('volumeIcon');
    const volumeLabel = document.getElementById('volumeLabel');

    audio.volume = volumeSlider.value / 100;

    function updateVolumeIcon(val) {
      volumeIcon.className = val == 0
        ? 'bi bi-volume-mute-fill'
        : val < 40
          ? 'bi bi-volume-down-fill'
          : 'bi bi-volume-up-fill';
    }

    volumeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = volumePopup.classList.toggle('visible');
    });

    volumeSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      audio.volume = val / 100;
      volumeLabel.textContent = val + '%';
      updateVolumeIcon(val);
    });

    // Hide popup when clicking anywhere outside the widget
    document.addEventListener('click', (e) => {
      if (!document.getElementById('volumeWidget').contains(e.target)) {
        volumePopup.classList.remove('visible');
      }
    });

    // Hide popup after mouse leaves the widget (with a short grace delay)
    document.getElementById('volumeWidget').addEventListener('mouseleave', () => {
      setTimeout(() => {
        volumePopup.classList.remove('visible');
      }, 800);
    });

    // Menu & Sidebar Functionality
    const menuBtn = document.getElementById('menuBtn');
    const closeMenuBtn = document.getElementById('closeMenuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    menuBtn.addEventListener('click', () => {
      sidebar.classList.add('active');
      overlay.classList.add('active');
    });

    closeMenuBtn.addEventListener('click', () => {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
    });

    overlay.addEventListener('click', () => {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
    });

    // Menu Items Functionality
    const menuItems = document.querySelectorAll('.menu-item');
    menuItems.forEach((item) => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        
        // Remove active state from all items
        menuItems.forEach(m => m.classList.remove('active'));
        // Add active state to clicked item
        item.classList.add('active');

        const menuText = item.textContent.trim();

        if (menuText.includes('Home')) {
          displayAlbums();
          sidebar.classList.remove('active');
          overlay.classList.remove('active');
        } else if (menuText.includes('Favorites')) {
          const container = document.getElementById('albumsContainer');
          container.innerHTML = '';
          if (favorites.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 50px; color: #ccc;"><h2>No Favorites Yet</h2><p>Add tracks to your favorites using the <i class="bi bi-heart-fill"></i> button!</p></div>';
          } else {
            // Rebuild favorite cards from saved keys
            favorites.forEach(key => {
              const [albumId, trackIdx] = key.split('_').map(Number);
              const album = albums.find(a => a.id === albumId);
              if (!album) return;
              const track = album.tracks[trackIdx];
              if (!track) return;
              const div = document.createElement('div');
              div.className = 'album';
              div.innerHTML = `
                <img src="${album.cover}" alt="${album.name}" onerror="this.src='https://placehold.co/180/333/ffa500?text=Check+Images+Folder'">
                <div class="album-desc">
                  <h3>${track.name}</h3>
                  <p>${album.name} - ${album.artist}</p>
                </div>
              `;
              div.addEventListener('click', () => {
                currentAlbum = album;
                currentTrackIdx = trackIdx;
                updateAlbumInfo(album);
                document.getElementById('playerContainer').style.display = 'block';
                playTrack();
              });
              container.appendChild(div);
            });
          }
          sidebar.classList.remove('active');
          overlay.classList.remove('active');
        } else if (menuText.includes('Playlists')) {
          alert('Playlists - Create and manage your playlists (coming soon)');
        } else if (menuText.includes('Settings')) {
          alert('Settings - Theme, volume, quality options (coming soon)');
        }
      });
    });


    // Search Functionality
    const searchInput = document.getElementById('searchInput');
    
    searchInput.addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase().trim();
      const container = document.getElementById('albumsContainer');
      const currentAlbumDivs = container.querySelectorAll('.album');

      currentAlbumDivs.forEach((albumDiv) => {
        // Get the album name from the h3 tag
        const albumName = albumDiv.querySelector('h3').innerText.toLowerCase();
        const artistName = albumDiv.querySelector('p').innerText.toLowerCase();
        
        // Get all track names from the track list
        const trackItems = albumDiv.querySelectorAll('.track-item');
        const trackNames = Array.from(trackItems).map(t => t.innerText.toLowerCase()).join(' ');

        const matches = albumName.includes(searchTerm) || 
                       artistName.includes(searchTerm) || 
                       trackNames.includes(searchTerm);

        albumDiv.style.display = matches || searchTerm === '' ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
